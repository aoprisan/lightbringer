name: Deploy to GitHub Pages

# Deploys the PWA (repo root) to GitHub Pages.
# Requires: Settings -> Pages -> "Build and deployment" -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile TypeScript modules to JavaScript
        run: npm run build
      - name: Prune non-shipped files from the artifact
        # The published site is the repo root, so everything that isn't served must
        # be stripped here: TS source, build config, internal planning docs, prompt
        # scratch, and the tools. What survives is the hub + the four game shells,
        # their compiled .js, the webmanifests, sw.js, and the art/icons they list.
        # (upload-pages-artifact already excludes .git and .github from its tar.)
        run: |
          rm -rf node_modules tools gemini-prompts art-prompts-output docs
          rm -f ./*.ts ./*.md LICENSE the-light-bringer.html
          rm -f package.json package-lock.json tsconfig.json .gitignore
      - uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
